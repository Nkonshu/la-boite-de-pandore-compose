<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Plan d'Accompagnement — La Boîte de Pandore</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<style>
  :root { --bg:#0B0D10; --surface:#14171C; --accent:#E8A33D; --good:#3DBD8C; --bad:#E2685A; --warn:#E8C93D; --text:#F3F1EC; --mute:#8B909A; --border:#262B33; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { margin: 0; font-weight: 700; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 90px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  h1 { font-size: 24px; margin-bottom: 8px; line-height: 1.3; }
  .intro { color: var(--mute); font-size: 14px; line-height: 1.5; margin-bottom: 22px; }

  /* Repère de parcours (orientation uniquement, non interactif) */
  .journey { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 22px; font-size: 11.5px; }
  .journey-step { color: var(--mute); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .journey-step.done { color: var(--good); border-color: var(--good); }
  .journey-step.current { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .journey-arrow { color: var(--mute); font-size: 11px; }

  /* Résumé rapide (niveau 1) */
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .summary-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .summary-row:last-child { border-bottom: none; }
  .summary-label { flex: 0 0 110px; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; padding-top: 2px; }
  .summary-value { flex: 1; font-size: 15px; line-height: 1.5; }

  /* Sections niveau 2 */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; }
  .section h3 { font-size: 15px; margin-bottom: 8px; }
  .section p { margin: 0; line-height: 1.6; white-space: pre-wrap; font-size: 14.5px; }
  .bullets { margin: 0; padding-left: 20px; }
  .bullets li { margin-bottom: 6px; line-height: 1.5; font-size: 14.5px; }
  .bullets li:last-child { margin-bottom: 0; }

  /* Niveau 3 : détails repliables */
  details.section { padding: 0; }
  details.section summary { cursor: pointer; padding: 16px 20px; font-size: 14.5px; font-weight: 600; color: var(--accent); list-style: none; }
  details.section summary::-webkit-details-marker { display: none; }
  details.section summary::before { content: '+ '; }
  details.section[open] summary::before { content: '– '; }
  details.section .detail-body { padding: 0 20px 18px; }
  .detail-subsection { margin-bottom: 18px; }
  .detail-subsection:last-child { margin-bottom: 0; }
  .detail-subsection h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--mute); margin-bottom: 8px; }
  .detail-subsection p { margin: 0; line-height: 1.6; font-size: 14.5px; }
  .point { display: flex; gap: 8px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
  .point:last-child { margin-bottom: 0; }
  .point-tag { flex: 0 0 auto; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 6px; height: fit-content; }
  .tag-unknown { background: rgba(139,144,154,0.2); color: var(--mute); }
  .tag-tradeoff { background: rgba(232,201,61,0.15); color: var(--warn); }
  .tag-risk { background: rgba(226,104,90,0.15); color: var(--bad); }
  .tag-next { background: rgba(61,189,140,0.15); color: var(--good); }

  .missing { color: var(--warn); font-size: 13px; margin-top: 8px; }

  /* Portée de la décision */
  .decision-scope { font-size: 13.5px; color: var(--text); line-height: 1.6; margin: 22px 0 14px; padding: 16px; background: rgba(139,144,154,0.08); border-radius: 10px; }
  .decision-scope .scope-note { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--mute); font-size: 13px; }

  .question { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  button { font-family: inherit; font-size: 14.5px; font-weight: 600; padding: 14px 18px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text); width: 100%; text-align: left; }
  button:hover { filter: brightness(1.15); }
  .btn-approve { border-color: var(--good); color: var(--good); }
  .btn-changes { border-color: var(--warn); color: var(--warn); }
  .btn-reject { border-color: var(--bad); color: var(--bad); }
  .decision-box { margin-top: 14px; display: none; }
  .decision-box.open { display: block; }
  textarea { width: 100%; min-height: 90px; background: #0F1216; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: inherit; font-size: 14px; resize: vertical; }
  .req { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .confirm-row { display: flex; gap: 10px; margin-top: 10px; }
  .state { text-align: center; padding: 100px 24px; color: var(--mute); }
  .state.error { color: var(--bad); }
  .state.ok { color: var(--good); }

  @media (max-width: 420px) {
    .summary-row { flex-direction: column; gap: 2px; }
    .summary-label { flex: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Chargement...</div></div>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const token = new URLSearchParams(location.search).get('token');
const app = document.getElementById('app');

const POINT_LABELS = {
  CONFIRMED_UNKNOWN: { tag: 'À déterminer', cls: 'tag-unknown' },
  FEASIBILITY_TRADEOFF: { tag: 'À arbitrer', cls: 'tag-tradeoff' },
  RISK: { tag: 'Point de vigilance', cls: 'tag-risk' },
  NEXT_ACTION: { tag: 'Prochaine étape', cls: 'tag-next' },
};

// Repère de parcours — orientation uniquement, jamais une autorisation :
// "Préparation de la stratégie" reste affiché comme étape FUTURE, jamais
// comme déjà engagée (aucune génération de Strategy n'est autorisée par
// cette page).
function renderJourney(){
  const steps = [
    { label: 'Audit terminé', state: 'done' },
    { label: "Plan d'accompagnement", state: 'done' },
    { label: 'Votre validation', state: 'current' },
    { label: 'Préparation de la stratégie', state: '' },
  ];
  return `<div class="journey">${steps.map((s, i) => `
    ${i > 0 ? '<span class="journey-arrow">→</span>' : ''}
    <span class="journey-step ${s.state}">${esc(s.label)}</span>
  `).join('')}</div>`;
}

function renderIntro(){
  return `
    <div class="eyebrow">Plan d'Accompagnement</div>
    <h1>Voici le plan que Pandore vous propose</h1>
    <div class="intro">Prenez quelques minutes pour vérifier que nous avons bien compris votre besoin et que la manière de travailler proposée vous convient.</div>
    ${renderJourney()}
  `;
}

// decisionScopeText : contenu spécifique rédigé pour ce plan/cette
// présentation (optionnel). La garantie de non-autorisation, elle, est
// TOUJOURS le même texte fixe par Kind, jamais dépendante de ce qu'un
// opérateur a pu écrire — Editorial Approval Public Frontend Readiness
// §6 : réutilise decisionScopeText plutôt que de dupliquer la vérité
// métier, mais garde ce filet de sécurité fixe pour les garanties qui ne
// doivent jamais dépendre de la rédaction d'un opérateur donné.
const DECISION_COPY = {
  PRESENTATION: {
    guarantee: `En approuvant ce plan, vous confirmez simplement que nous pouvons travailler sur cette base.<br>
      Rien ne sera publié automatiquement. Toute nouvelle étape nécessitant votre accord vous sera présentée séparément.`,
    question: 'Ce plan vous convient-il ?',
    approve: 'Oui, ce plan me convient',
    changesPrompt: 'Qu’aimeriez-vous modifier ?',
    reject: 'Ce plan ne me convient pas',
  },
  LEGACY: {
    guarantee: `En approuvant ce plan, vous confirmez simplement que nous pouvons travailler sur cette base.<br>
      Rien ne sera publié automatiquement. Toute nouvelle étape nécessitant votre accord vous sera présentée séparément.`,
    question: 'Ce plan vous convient-il ?',
    approve: 'Oui, ce plan me convient',
    changesPrompt: 'Qu’aimeriez-vous modifier ?',
    reject: 'Ce plan ne me convient pas',
  },
  EDITORIAL_REVIEW_PRESENTATION: {
    guarantee: `En approuvant cette orientation, vous acceptez la ligne éditoriale proposée comme guide pour vos futurs contenus.<br>
      Cela n’approuve aucun contenu précis, n’autorise aucune publication et ne connecte aucun compte social — chaque étape suivante vous sera présentée séparément.`,
    question: 'Cette orientation éditoriale vous convient-elle ?',
    approve: 'Oui, cette orientation me convient',
    changesPrompt: 'Qu’aimeriez-vous ajuster ?',
    reject: 'Cette orientation ne me convient pas',
  },
};

function renderDecisionArea(decisionScopeText, kind){
  const copy = DECISION_COPY[kind] || DECISION_COPY.PRESENTATION;
  return `
    <div class="decision-scope">
      ${copy.guarantee}
      ${decisionScopeText ? `<div class="scope-note">${esc(decisionScopeText)}</div>` : ''}
    </div>
    <div class="question">${esc(copy.question)}</div>
    <div class="actions">
      <button class="btn-approve" data-decision="APPROVED">${esc(copy.approve)}</button>
      <button class="btn-changes" data-decision="CHANGES_REQUESTED">Je souhaite modifier certains points</button>
      <button class="btn-reject" data-decision="REJECTED">${esc(copy.reject)}</button>
    </div>
    <div class="decision-box" id="box-APPROVED">
      <textarea id="comment-APPROVED" placeholder="Commentaire (optionnel)"></textarea>
      <div class="confirm-row"><button class="btn-approve" id="confirm-APPROVED">Confirmer</button></div>
    </div>
    <div class="decision-box" id="box-CHANGES_REQUESTED">
      <div style="font-size:13px;color:var(--mute);margin-bottom:8px;">${esc(copy.changesPrompt)}</div>
      <textarea id="comment-CHANGES_REQUESTED" placeholder="Décrivez ce qui doit changer"></textarea>
      <div class="req" id="req-CHANGES_REQUESTED" style="display:none;">Merci de préciser ce que vous aimeriez modifier.</div>
      <div class="confirm-row"><button class="btn-changes" id="confirm-CHANGES_REQUESTED">Confirmer</button></div>
    </div>
    <div class="decision-box" id="box-REJECTED">
      <textarea id="comment-REJECTED" placeholder="Commentaire (optionnel)"></textarea>
      <div class="confirm-row"><button class="btn-reject" id="confirm-REJECTED">Confirmer</button></div>
    </div>
  `;
}

function wireDecisionArea(){
  for (const btn of app.querySelectorAll('[data-decision]')){
    btn.addEventListener('click', () => {
      for (const box of app.querySelectorAll('.decision-box')) box.classList.remove('open');
      document.getElementById('box-' + btn.dataset.decision).classList.add('open');
    });
  }
  for (const decision of ['APPROVED','CHANGES_REQUESTED','REJECTED']){
    document.getElementById('confirm-' + decision).addEventListener('click', () => submit(decision));
  }
}

// --- Rendu "PRESENTATION" (structuré, divulgation progressive) ---
function renderPresentation(p){
  const points = (p.points_to_watch || []).map(pt => {
    const label = POINT_LABELS[pt.kind] || { tag: 'Point', cls: 'tag-unknown' };
    return `<div class="point"><span class="point-tag ${label.cls}">${esc(label.tag)}</span><span>${esc(pt.client_text)}</span></div>`;
  }).join('');

  const hasWhy = !!p.why_explanation;
  const hasPoints = !!points;

  app.innerHTML = `
    ${renderIntro()}

    <div class="summary-card">
      <div class="summary-row"><div class="summary-label">Objectif</div><div class="summary-value">${esc(p.objective_summary)}</div></div>
      <div class="summary-row"><div class="summary-label">Public</div><div class="summary-value">${esc(p.audience_summary)}</div></div>
      <div class="summary-row"><div class="summary-label">Canal</div><div class="summary-value">${esc(p.channel)}</div></div>
      <div class="summary-row"><div class="summary-label">Rythme</div><div class="summary-value">${esc(p.cadence_summary)}</div></div>
      <div class="summary-row"><div class="summary-label">Validation</div><div class="summary-value">${esc(p.validation_summary)}</div></div>
    </div>

    <div class="section"><h3>Ce que nous avons compris</h3><p>${esc(p.what_we_understood)}</p></div>
    <div class="section"><h3>Ce que Pandore propose</h3><p>${esc(p.what_pandore_proposes)}</p></div>
    ${p.pandore_commitments && p.pandore_commitments.length ? `<div class="section"><h3>Ce que Pandore fera</h3><ul class="bullets">${p.pandore_commitments.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
    ${p.client_needs && p.client_needs.length ? `<div class="section"><h3>Ce dont nous aurons besoin de votre part</h3><ul class="bullets">${p.client_needs.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
    <div class="section"><h3>Comment nous mesurerons les résultats</h3><p>${esc(p.measurement_explanation)}</p></div>

    ${(hasWhy || hasPoints) ? `
    <details class="section">
      <summary>Voir plus de détails</summary>
      <div class="detail-body">
        ${hasWhy ? `<div class="detail-subsection"><h4>Pourquoi nous proposons cette approche</h4><p>${esc(p.why_explanation)}</p></div>` : ''}
        ${hasPoints ? `<div class="detail-subsection"><h4>Points à garder en tête</h4>${points}</div>` : ''}
      </div>
    </details>` : ''}

    ${renderDecisionArea(p.decision_scope, 'PRESENTATION')}
  `;
  wireDecisionArea();
}

// --- Rendu "LEGACY" (représentation directe historique, inchangée) ---
function renderLegacy(p){
  const missing = (p.missing_information || []).length
    ? `<div class="missing">Informations manquantes : ${p.missing_information.map(esc).join(', ')}</div>` : '';
  app.innerHTML = `
    ${renderIntro()}
    <div class="section"><h3>Ce que nous avons compris</h3><p>${esc(p.problem_understood) || '—'}</p></div>
    <div class="section"><h3>Audience</h3><p>${esc(p.audience) || '—'}</p></div>
    <div class="section"><h3>Proposition</h3><p>${esc(p.proposal) || '—'}</p>${missing}</div>
    <div class="section"><h3>Pandore s'engage à</h3><p>${esc(p.pandore_responsibilities) || '—'}</p></div>
    <div class="section"><h3>De votre côté</h3><p>${esc(p.client_responsibilities) || '—'}</p></div>
    <div class="section"><h3>Comment nous mesurerons les résultats</h3><p>${esc(p.measurement_method) || '—'}</p></div>
    ${p.known_limitations ? `<div class="section"><h3>Limites connues</h3><p>${esc(p.known_limitations)}</p></div>` : ''}
    ${renderDecisionArea('', 'LEGACY')}
  `;
  wireDecisionArea();
}

// --- Rendu "EDITORIAL_REVIEW_PRESENTATION" (Editorial Review Client
// Approval Path) — champs STRICTEMENT limités à ce que le backend fournit
// (client_text/is_recommendation/decision_scope) : jamais de dimension,
// source_refs, provenance, hash ou statut Strategy affichés (voir
// core.EditorialStatement — ces champs n'existent même pas dans la
// réponse publique, impossibles à afficher par construction).
function renderEditorialIntro(){
  return `
    <div class="eyebrow">Orientation éditoriale</div>
    <h1>Voici l'orientation que Pandore propose pour vos contenus</h1>
    <div class="intro">Cette orientation s'appuie sur la stratégie déjà approuvée. Prenez quelques minutes pour vérifier qu'elle vous convient.</div>
  `;
}

function renderEditorial(p){
  document.title = 'Orientation éditoriale — La Boîte de Pandore';
  const statements = p.statements || [];
  const established = statements.filter(s => !s.is_recommendation);
  const recommendations = statements.filter(s => s.is_recommendation);

  app.innerHTML = `
    ${renderEditorialIntro()}

    ${established.length ? `<div class="section"><h3>Ce qui est déjà établi</h3><ul class="bullets">${established.map(s => `<li>${esc(s.client_text)}</li>`).join('')}</ul></div>` : ''}
    ${recommendations.length ? `<div class="section"><h3>Nos recommandations</h3><ul class="bullets">${recommendations.map(s => `<li>${esc(s.client_text)}</li>`).join('')}</ul></div>` : ''}

    ${renderDecisionArea(p.decision_scope, 'EDITORIAL_REVIEW_PRESENTATION')}
  `;
  wireDecisionArea();
}

// Messages client-safe pour un statut déjà décidé — jamais la valeur brute
// de l'enum backend affichée telle quelle (CHANGES_REQUESTED/APPROVED/
// REJECTED/EXPIRED/PENDING ne doivent jamais apparaître à l'écran).
//
// PENDING_STATUS_BY_KIND — Editorial Approval Public Frontend Readiness
// §3/§8 : le statut qui signifie "en attente de décision" dépend du Kind.
// Plan expose son PROPRE Status (SENT une fois envoyé, muté par la
// décision). EditorialReviewPresentation est immuable et ne porte aucun
// statut : la réponse publique expose désormais Status=ApprovalRequest.Status
// (PENDING tant qu'aucune décision n'a été prise) — voir
// toPublicEditorialReviewPresentationView côté Go.
const PENDING_STATUS_BY_KIND = {
  PRESENTATION: 'SENT',
  LEGACY: 'SENT',
  EDITORIAL_REVIEW_PRESENTATION: 'PENDING',
};

const STATUS_MESSAGES = {
  PRESENTATION: {
    APPROVED: 'Vous avez approuvé ce plan.',
    CHANGES_REQUESTED: 'Votre demande de modification a bien été enregistrée. Pandore préparera une nouvelle version en tenant compte de votre retour.',
    REJECTED: 'Vous avez indiqué que ce plan ne vous convient pas. Votre retour a bien été enregistré.',
    EXPIRED: "Ce lien n'est plus actif.",
  },
  EDITORIAL_REVIEW_PRESENTATION: {
    APPROVED: 'Vous avez approuvé cette orientation éditoriale.',
    CHANGES_REQUESTED: 'Votre demande d’ajustement a bien été enregistrée. Pandore en tiendra compte pour la suite.',
    REJECTED: 'Vous avez indiqué que cette orientation ne vous convient pas. Votre retour a bien été enregistré.',
    EXPIRED: "Ce lien n'est plus actif.",
  },
};
STATUS_MESSAGES.LEGACY = STATUS_MESSAGES.PRESENTATION;

function clientSafeStatusMessage(status, kind){
  const messages = STATUS_MESSAGES[kind] || STATUS_MESSAGES.PRESENTATION;
  return messages[status] || "Ce lien n'est plus actif.";
}

// currentKind — capturé au chargement, utilisé uniquement pour choisir le
// bon message de confirmation après soumission (jamais pour changer quel
// endpoint est appelé : submit() reste un seul chemin générique quel que
// soit le Kind, exactement comme le décide déjà le backend).
let currentKind = 'PRESENTATION';

async function submit(decision){
  const comment = document.getElementById('comment-' + decision).value.trim();
  if (decision === 'CHANGES_REQUESTED' && !comment){
    document.getElementById('req-CHANGES_REQUESTED').style.display = 'block';
    return;
  }
  try{
    const res = await fetch(`/api/public/plans/${encodeURIComponent(token)}/decision`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision, comment }),
    });
    if(res.ok){
      app.innerHTML = `<div class="state ok">✓ ${esc(clientSafeStatusMessage(decision, currentKind))}</div>`;
      return;
    }
    const data = await res.json().catch(() => ({}));
    const msg = (data.error && data.error.message) || 'Erreur lors de l\'enregistrement.';
    app.innerHTML = `<div class="state error">${esc(msg)}</div>`;
  }catch(err){
    app.innerHTML = '<div class="state error">Erreur réseau — réessayez dans un instant.</div>';
  }
}

async function load(){
  if(!token){
    app.innerHTML = '<div class="state error">Aucun jeton dans ce lien.</div>';
    return;
  }
  try{
    const res = await fetch(`/api/public/plans/${encodeURIComponent(token)}`);
    if(res.status === 404){
      app.innerHTML = '<div class="state error">Ce lien est invalide ou a déjà été utilisé.</div>';
      return;
    }
    if(res.status === 409){
      app.innerHTML = '<div class="state error">Cette version n\'est plus celle en attente de décision — une version plus récente existe.</div>';
      return;
    }
    if(!res.ok) throw new Error('load_failed');
    const data = await res.json();
    currentKind = data.kind || 'PRESENTATION';
    const pendingStatus = PENDING_STATUS_BY_KIND[currentKind] || 'SENT';
    if(data.status !== pendingStatus){
      app.innerHTML = `<div class="state">${esc(clientSafeStatusMessage(data.status, currentKind))}</div>`;
      return;
    }
    if(currentKind === 'EDITORIAL_REVIEW_PRESENTATION'){
      renderEditorial(data);
    } else if(currentKind === 'PRESENTATION'){
      renderPresentation(data);
    } else {
      renderLegacy(data);
    }
  }catch(err){
    app.innerHTML = '<div class="state error">Erreur de chargement — réessayez dans un instant.</div>';
  }
}
load();
</script>
</body>
</html>
