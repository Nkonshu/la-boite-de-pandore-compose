<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comptes sociaux — La Boîte de Pandore</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D10;
    --surface: #14171C;
    --surface-raised: #1C2027;
    --accent: #E8A33D;
    --good: #3DBD8C;
    --bad: #E2685A;
    --text: #F3F1EC;
    --mute: #8B909A;
    --mute-dim: #5B616B;
    --border: #262B33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Instrument Sans', 'IBM Plex Sans', sans-serif; margin: 0; }
  a { color: var(--accent); }

  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .gate-box { width: 100%; max-width: 360px; padding: 24px; }
  .gate-box h1 { font-size: 22px; margin-bottom: 20px; }
  .gate-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 14px; color: var(--text); font-family: inherit; font-size: 15px; margin-bottom: 14px;
  }
  .gate-box input:focus { outline: none; border-color: var(--accent); }
  .gate-box .err { color: var(--bad); font-size: 13px; margin-bottom: 12px; display: none; }
  .gate-box .err.show { display: block; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: #201404; font-weight: 700; font-size: 14px;
    padding: 11px 22px; border-radius: 999px; border: none; cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600; }
  .btn-sm { padding: 6px 14px; font-size: 12.5px; }
  .btn-danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); font-weight: 600; }

  #dashboard { display: none; }
  #dashboard.show { display: block; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px 90px; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .topbar h1 { font-size: 24px; font-weight: 700; }
  .topbar .sub { font-size: 13px; color: var(--mute-dim); }

  .tenant-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; flex-wrap: wrap;
  }
  .tenant-bar label { font-size: 12.5px; color: var(--mute); white-space: nowrap; }
  .tenant-bar input {
    flex: 1; min-width: 220px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  }
  .tenant-bar input:focus { outline: none; border-color: var(--accent); }

  .panel { margin-bottom: 32px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel h2 {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent);
  }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-scroll { overflow-x: auto; border-radius: 12px; }
  th, td { text-align: left; padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute-dim); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.date { color: var(--mute-dim); white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  td.scopes { color: var(--mute); font-size: 12px; }

  .pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; }
  .pill.connected { background: rgba(61,189,140,0.14); color: var(--good); }
  .pill.revoked { background: rgba(226,104,90,0.14); color: var(--bad); }
  .pill.platform-facebook { background: rgba(139,144,154,0.14); color: var(--mute); }
  .pill.platform-instagram { background: rgba(232,163,61,0.14); color: var(--accent); }

  .empty-row td { text-align: center; color: var(--mute-dim); padding: 28px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--good); }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>Administration — La Boîte de Pandore</h1>
    <input type="password" id="pwInput" placeholder="Mot de passe" autocomplete="current-password">
    <div class="err" id="gateErr">Mot de passe incorrect.</div>
    <button class="btn" id="loginBtn" style="width:100%">Se connecter</button>
  </div>
</div>

<div id="dashboard">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Comptes sociaux</h1>
        <div class="sub"><a href="/admin/index.html">← Contacts &amp; audits</a></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="refresh()">Rafraîchir</button>
    </div>

    <div class="tenant-bar">
      <label for="tenantInput">tenant_id</label>
      <input type="text" id="tenantInput" placeholder="ex : t_9f3a2b...">
      <button class="btn btn-ghost btn-sm" id="loadTenantBtn">Charger</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Comptes connectés</h2>
        <button class="btn btn-sm" id="connectBtn">Connecter Facebook / Instagram</button>
      </div>
      <div class="table-scroll">
        <table id="accountsTable">
          <thead><tr><th>Plateforme</th><th>Nom</th><th>Statut</th><th>Permissions</th><th>Connecté le</th><th></th></tr></thead>
          <tbody><tr class="empty-row"><td colspan="6">Renseignez un tenant_id ci-dessus.</td></tr></tbody>
        </table>
      </div>
      <div class="msg" id="actionMsg"></div>
    </div>
  </div>
</div>

<script>
const PW_KEY = 'pandore_admin_pw';

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
}

async function api(path, opts = {}){
  const pw = localStorage.getItem(PW_KEY) || '';
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers || {}), 'x-admin-password': pw },
  });
  if(res.status === 401){
    localStorage.removeItem(PW_KEY);
    showGate(true);
    throw new Error('unauthorized');
  }
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const message = (data && data.error && (data.error.message || data.error)) || `Erreur ${res.status}`;
    throw new Error(message);
  }
  return data;
}

function showGate(withError){
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('gateErr').classList.toggle('show', !!withError);
}

function showDashboard(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dashboard').classList.add('show');
  const params = new URLSearchParams(location.search);
  const tenantId = params.get('tenant_id');
  if(tenantId){
    document.getElementById('tenantInput').value = tenantId;
    refresh();
  }
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('pwInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryLogin(); });

async function tryLogin(){
  const pw = document.getElementById('pwInput').value;
  localStorage.setItem(PW_KEY, pw);
  try{
    // Toute route /api/admin/* protégée peut servir de vérification —
    // /api/admin/social-accounts exige aussi tenant_id, /api/admin/contacts
    // n'a besoin de rien d'autre.
    await api('/api/admin/contacts');
    showDashboard();
  }catch(err){
    showGate(true);
  }
}

function currentTenantId(){
  return document.getElementById('tenantInput').value.trim();
}

document.getElementById('loadTenantBtn').addEventListener('click', refresh);
document.getElementById('tenantInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') refresh(); });

document.getElementById('connectBtn').addEventListener('click', connectMeta);

async function connectMeta(){
  const tenantId = currentTenantId();
  const msgEl = document.getElementById('actionMsg');
  msgEl.className = 'msg';
  msgEl.textContent = '';
  if(!tenantId){
    msgEl.className = 'msg err';
    msgEl.textContent = 'Renseignez un tenant_id avant de connecter un compte.';
    return;
  }
  try{
    const pw = localStorage.getItem(PW_KEY) || '';
    const res = await fetch(`/api/admin/social-accounts/meta/authorize-url?tenant_id=${encodeURIComponent(tenantId)}`, {
      headers: { 'x-admin-password': pw },
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    location.href = data.url;
  }catch(err){
    msgEl.className = 'msg err';
    msgEl.textContent = err.message;
  }
}

async function refresh(){
  const tenantId = currentTenantId();
  const tbody = document.querySelector('#accountsTable tbody');
  if(!tenantId){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Renseignez un tenant_id ci-dessus.</td></tr>';
    return;
  }
  tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Chargement...</td></tr>';
  const url = new URL(location.href);
  url.searchParams.set('tenant_id', tenantId);
  history.replaceState(null, '', url);
  try{
    const accounts = await api(`/api/admin/social-accounts?tenant_id=${encodeURIComponent(tenantId)}`);
    render(Array.isArray(accounts) ? accounts : []);
  }catch(err){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">${esc(err.message)}</td></tr>`;
  }
}

function render(accounts){
  const tbody = document.querySelector('#accountsTable tbody');
  if(accounts.length === 0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Aucun compte connecté pour ce tenant.</td></tr>';
    return;
  }
  const sorted = [...accounts].sort((a,b) => new Date(b.connected_at) - new Date(a.connected_at));
  tbody.innerHTML = sorted.map(a => `
    <tr>
      <td><span class="pill platform-${esc(a.platform)}">${esc(a.platform)}</span></td>
      <td>${esc(a.display_name || a.external_account_id)}</td>
      <td><span class="pill ${a.status === 'CONNECTED' ? 'connected' : 'revoked'}">${a.status === 'CONNECTED' ? 'connecté' : 'révoqué'}</span></td>
      <td class="scopes">${(a.granted_scopes || []).map(esc).join(', ') || '—'}</td>
      <td class="date">${fmtDate(a.connected_at)}</td>
      <td>${a.status === 'CONNECTED'
        ? `<button class="btn btn-danger btn-sm" onclick="revoke('${esc(a.id)}')">Révoquer</button>`
        : ''}</td>
    </tr>
  `).join('');
}

async function revoke(id){
  const msgEl = document.getElementById('actionMsg');
  try{
    await api(`/api/admin/social-accounts/${encodeURIComponent(id)}/revoke`, { method: 'POST' });
    msgEl.className = 'msg ok';
    msgEl.textContent = 'Compte révoqué.';
    refresh();
  }catch(err){
    msgEl.className = 'msg err';
    msgEl.textContent = err.message;
  }
}

(async function init(){
  if(localStorage.getItem(PW_KEY)){
    try{
      await api('/api/admin/contacts');
      showDashboard();
    }catch(err){
      showGate(false);
    }
  } else {
    showGate(false);
  }
})();
</script>
</body>
</html>
